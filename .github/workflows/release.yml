# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes a GitHub Release when a version tag (v0.2.0) is pushed: the
# Windows installer and the portable zip, then the macOS disk image, the
# Linux .deb and AppImage, and the portable tar.gz for each (PRD §15). Download counts show on
# the release page and through the GitHub API; MeowServer itself sends
# nothing. 0.x versions are marked as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup 6.7.3 (checksum verified)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") { throw "checksum mismatch: $hash" }
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/NOICONS' -Wait
      - name: The tag matches the version being built
        shell: pwsh
        run: |
          $version = (Select-String Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but Cargo.toml says $version" }
      - name: cargo xtask dist
        shell: pwsh
        run: |
          cargo xtask dist
          if (-not (Test-Path dist/*-setup.exe)) { throw "the installer was not built" }
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pre = if ($tag -like "v0.*") { "--prerelease" } else { "" }
          $notes = @"
          Windows: run the setup. It installs for your user only (no administrator rights) into C:\MeowServer, or updates the folder you already have, keeping projects, databases, and settings. The zip is the same program without an installer.

          Not code-signed yet, so Windows SmartScreen and the UAC prompt show "Unknown publisher".

          Linux (x86_64 and arm64): install the .deb (``sudo apt install ./MeowServer-…-linux-x86_64.deb``), or make the AppImage executable and run it. Both keep their data in ~/.local/share/meowserver and serve projects from ~/www; the .tar.gz is the portable folder. Built on Ubuntu 22.04: glibc 2.35 or newer.

          macOS (Apple silicon): open the .dmg and drag MeowServer to Applications. It is not notarized yet: on first open choose System Settings > Privacy & Security > Open Anyway (or run ``xattr -dr com.apple.quarantine /Applications/MeowServer.app``). The app keeps its data in ~/Library/Application Support/MeowServer and serves projects from ~/Sites; the .tar.gz is the portable folder.
          "@
          gh release create $tag (Get-ChildItem dist/*-setup.exe, dist/*.zip) --title "MeowServer $($tag.TrimStart('v'))" --notes $notes --generate-notes $pre

  macos:
    name: macOS disk image and tar.gz
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag matches the version being built
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} but Cargo.toml says $version"; exit 1; }
      - name: cargo xtask dist
        run: |
          cargo xtask dist
          ls dist/*.dmg
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.dmg dist/*.tar.gz

  linux:
    name: Linux ${{ matrix.arch }} .deb, AppImage, and tar.gz
    needs: windows
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            appimagetool: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            runner: ubuntu-22.04-arm
            appimagetool: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for the tray and window
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libfontconfig1-dev libxkbcommon-x11-0
      - name: appimagetool 1.9.1 and runtime 20251108 (checksums verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage
          curl -sSfLo runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.arch }}
          echo "${{ matrix.appimagetool }}  appimagetool" | sha256sum -c
          echo "${{ matrix.runtime }}  runtime" | sha256sum -c
          chmod +x appimagetool
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"
      - name: The tag matches the version being built
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} but Cargo.toml says $version"; exit 1; }
      - name: cargo xtask dist
        run: |
          cargo xtask dist
          ls dist/*.deb dist/*.AppImage
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.deb dist/*.AppImage dist/*.tar.gz
