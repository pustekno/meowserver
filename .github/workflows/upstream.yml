# SPDX-License-Identifier: GPL-3.0-or-later
# Weekly: call every download source MeowServer reads (PRD §9.5) and fail
# when one changes its format, before users notice.
name: Upstream sources

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  providers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p meow-core --test upstream -- --ignored --nocapture
        env:
          # GitHub's API limit without a token is shared by every job on
          # the runner's address; macOS runners hit it (HTTP 403).
          MEOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
