name: Idea or feature request
description: Something MeowServer could do. Open questions fit better in Discussions.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do, and what gets in the way today?
      description: The problem first; a solution is welcome too. English or Indonesian.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could MeowServer help?
