[package]
name = "meow-app"
description = "MeowServer window (meowserver)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "meowserver"
path = "src/main.rs"

[dependencies]
meow-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
rfd = { version = "0.17", default-features = false }

[build-dependencies]
slint-build = "1.18"
